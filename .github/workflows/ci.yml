name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.121.0

jobs:
  quality:
    name: Lint, tipos, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (valores de exemplo; o deploy usa os do ambiente)
        run: pnpm --filter @agendae/web build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_exemplo

  database:
    name: Banco (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase db start
      - run: supabase test db
      - name: Tipos gerados estão em dia
        run: |
          supabase gen types typescript --local > /tmp/types.ts
          diff -u packages/shared/src/database.types.ts /tmp/types.ts

  e2e:
    name: E2E (Playwright + axe) no build de produção
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Supabase local (migrations + seed)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Variáveis do front-end a partir do Supabase local
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } > apps/web/.env.local
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Edge Functions
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/public-booking || true)
            [ "$code" = "204" ] && break
            sleep 2
          done
      - run: pnpm --filter @agendae/web exec playwright install --with-deps chromium
      - run: pnpm --filter @agendae/web build
      - run: pnpm --filter @agendae/web e2e
        env:
          E2E_PREVIEW: '1'
          CI: '1'
      - if: failure()
        run: cat functions.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agendae-web:ci
          build-args: |
            VITE_SUPABASE_URL=https://exemplo.supabase.co
            VITE_SUPABASE_ANON_KEY=sb_publishable_exemplo
          cache-from: type=gha
          cache-to: type=gha,mode=max
