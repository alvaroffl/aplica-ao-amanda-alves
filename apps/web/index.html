<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1d19" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Amanda Alves | Estética Avançada. Agende micropigmentação de sobrancelhas e lábios, camuflagem, remoção a laser e protocolos de pele."
    />
    <title>Amanda Alves | Estética Avançada</title>
    <!-- Prévia do link (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Amanda Alves | Estética Avançada" />
    <meta property="og:title" content="Amanda Alves | Estética Avançada" />
    <meta
      property="og:description"
      content="Agende sua avaliação gratuita ou seu procedimento: micropigmentação de sobrancelhas e lábios, camuflagem, remoção a laser e protocolos de pele."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Amanda Alves" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/theme-init.js"></script>
    <!-- Materiais da "recepção" (mármore, cerejeira, logo): baixam junto com o JS,
         em vez de esperar a página montar. São leves (4–16 KB). A logo é usada
         como máscara CSS, buscada em modo CORS: daí o crossorigin. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/brand/marmore-portrait.avif"
      media="(orientation: portrait) and (prefers-color-scheme: light)"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/brand/marmore-landscape.avif"
      media="(orientation: landscape) and (prefers-color-scheme: light)"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/brand/marmore-escuro.avif"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="preload" as="image" href="/brand/monograma.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/brand/logo-amanda-alves.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/brand/cerejeira.svg" />
    <!-- Fontes da identidade (latin): o título serifado é o maior texto da tela -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="/node_modules/@fontsource-variable/playfair-display/files/playfair-display-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
